[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gastos"
version = "0.1.0"
description = "Gasto de campanha com plataformas de anuncio estrangeiras (dados abertos do TSE)"
requires-python = ">=3.10"
dependencies = ["pandas", "pyyaml", "jinja2", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gastos = "gastos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
