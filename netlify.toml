# Site estático: não há build. A Netlify só publica a pasta `site/`.
[build]
  publish = "site"
  command = "echo 'sem build: site estatico'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Sem frame-ancestors/X-Frame-Options de propósito: a página pode ser incorporada pelo dono em outro site.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"
